name: Visual portfolio region and arithmetic QA
on:
  pull_request:
    paths:
      - 'src/portfolio-visual-evidence.mjs'
      - 'tests/portfolio-visual-evidence.test.mjs'
      - 'tests/portfolio-inline-ledger.test.mjs'
      - 'tests/fixtures/portfolio-inline-ledger.mjs'
      - 'tests/fixtures/portfolio-visual-ledger.mjs'
      - 'tests/e2e/portfolio-visual-ledger.spec.mjs'
      - '.github/workflows/visual-portfolio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Source-bound portfolio unit tests
        run: node --test tests/portfolio-visual-evidence.test.mjs tests/portfolio-inline-ledger.test.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tesseract.js@5.1.0
      - run: node scripts/prepare-local-ocr.mjs
      - run: npx playwright install --with-deps chromium
      - name: Real local browser OCR of fictional full screen + crop
        env:
          REAL_OCR_QA: '1'
        run: npx playwright test portfolio-visual-ledger.spec.mjs --reporter=list
