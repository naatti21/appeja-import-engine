name: Isolated structure learning QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/structure-learning.mjs'
      - 'src/mobile-card-holdings.mjs'
      - 'src/mobile-review-session.mjs'
      - 'src/review-draft.mjs'
      - 'tests/mobile-review-session.test.mjs'
      - 'tests/mobile-learning-safety.test.mjs'
      - 'tests/e2e/mobile-corrections.spec.mjs'
      - 'tests/e2e/mobile-learning-safety.spec.mjs'
      - 'tests/e2e/name-evidence-metrics.spec.mjs'
      - 'scripts/prepare-local-ocr.mjs'
      - 'src/import-observations.mjs'
      - 'src/numbers.mjs'
      - 'demo/structure-learning.*'
      - 'tests/**/structure-learning*'
      - 'tests/mobile-card-holdings.test.mjs'
      - 'tests/fixtures/mobile-cards.mjs'
      - '.github/workflows/structure-learning-qa.yml'
permissions:
  contents: read
jobs:
  source-bound-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tesseract.js@5.1.0
      - run: node scripts/prepare-local-ocr.mjs --swedish
      - run: npx playwright install --with-deps chromium
      - run: git rev-parse HEAD > structure-tested-sha.txt
      - id: node_tests
        run: npm test > structure-node-qa.log 2>&1
      - name: Real OCR and mobile learning, synthetic input only
        if: ${{ !cancelled() && (steps.node_tests.outcome == 'success' || steps.node_tests.outcome == 'failure') }}
        env:
          REAL_OCR_QA: '1'
        run: npx playwright test structure-learning.spec.mjs mobile-corrections.spec.mjs mobile-learning-safety.spec.mjs --reporter=list,json > structure-qa.log 2>&1
      - name: P0 source-binding and poisoning focused Node checks
        if: ${{ !cancelled() }}
        run: node --test tests/mobile-learning-safety.test.mjs tests/mobile-name-corroboration.test.mjs 2>&1 | tee p0-focused-node.log
      - name: P0 true pixel OCR source-binding attacks
        if: ${{ !cancelled() }}
        env:
          REAL_OCR_QA: '1'
        run: npx playwright test mobile-learning-safety.spec.mjs --reporter=list 2>&1 | tee p0-focused-browser.log
      - name: Held-out real pixel OCR name-source metrics
        if: ${{ !cancelled() }}
        env:
          REAL_OCR_QA: '1'
        run: npx playwright test name-evidence-metrics.spec.mjs --reporter=list 2>&1 | tee name-evidence-metrics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-learning-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            structure-qa.log
            structure-node-qa.log
            name-evidence-metrics.log
            p0-focused-node.log
            p0-focused-browser.log
            structure-tested-sha.txt
            test-results/
          retention-days: 14
