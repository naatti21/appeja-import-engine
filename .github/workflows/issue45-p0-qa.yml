name: Issue45 P0 learned heading safety QA
on:
  pull_request:
    paths:
      - 'src/mobile-card-holdings.mjs'
      - 'tests/issue45-legacy-audit.test.mjs'
      - 'tests/e2e/issue45-legacy-audit.spec.mjs'
      - '.github/workflows/issue45-p0-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issue45-p0-heading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Focused independently source-bound Node P0 checks
        run: node --test tests/issue45-legacy-audit.test.mjs tests/mobile-learning-safety.test.mjs tests/structure-learning.test.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tesseract.js@5.1.0
      - run: node scripts/prepare-local-ocr.mjs --swedish
      - run: npx playwright install --with-deps chromium
      - name: Actual pixels to OCR against learned heading poison
        env:
          REAL_OCR_QA: '1'
        run: npx playwright test issue45-legacy-audit.spec.mjs --reporter=list
