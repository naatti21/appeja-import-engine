name: LAB QA Agent - Deterministic Variations
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'demo/**'
      - '.github/workflows/qa-variations.yml'
  workflow_dispatch:
    inputs:
      cases:
        description: "Clean generated cases per seed (1-1000)"
        required: false
        default: '120'
      seeds:
        description: "Comma-separated deterministic seeds"
        required: false
        default: '17,43,97,211'
permissions:
  contents: read
jobs:
  generated-node:
    name: Independent Oracles / Negative Variations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_CASES: ${{ inputs.cases || '120' }}
      QA_SEEDS: ${{ inputs.seeds || '17,43,97,211' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Deterministic synthetic QA matrix
        run: node --test tests/qa-variants.test.mjs tests/qa-ocr-variations.test.mjs
  native-pdf-and-mobile:
    name: Real PDF.js and Mobile UI Variations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native PDF variants plus phone widths
        run: npm run test:e2e -- --grep "QA generated|QA mobile"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-qa-failures
          path: test-results/
          retention-days: 3
